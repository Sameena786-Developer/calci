<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            display: none;
        }

        .result p {
            margin: 8px 0;
            font-size: 17px;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Marks Calculator</h1>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Subject 1</label>
        <input type="number" id="mark1" placeholder="Enter marks">

        <label>Subject 2</label>
        <input type="number" id="mark2" placeholder="Enter marks">

        <label>Subject 3</label>
        <input type="number" id="mark3" placeholder="Enter marks">

        <label>Subject 4</label>
        <input type="number" id="mark4" placeholder="Enter marks">

        <label>Subject 5</label>
        <input type="number" id="mark5" placeholder="Enter marks">

        <button onclick="calculate()">Calculate Result</button>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <p><strong>Student:</strong> <span id="studentName"></span></p>
            <p><strong>Total:</strong> <span id="total"></span> / 500</p>
            <p><strong>Percentage:</strong> <span id="percentage"></span>%</p>
            <p><strong>Grade:</strong> <span id="grade"></span></p>
        </div>

    </div>

    <script>
        function calculate() {

            let name = document.getElementById("name").value;

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);

            let error = document.getElementById("error");
            let result = document.getElementById("result");

            error.innerText = "";

            // Check whether all fields are filled
            if (
                name === "" ||
                document.getElementById("mark1").value === "" ||
                document.getElementById("mark2").value === "" ||
                document.getElementById("mark3").value === "" ||
                document.getElementById("mark4").value === "" ||
                document.getElementById("mark5").value === ""
            ) {
                error.innerText = "Please fill all fields.";
                result.style.display = "none";
                return;
            }

            // Check marks
            if (
                mark1 < 0 || mark1 > 100 ||
                mark2 < 0 || mark2 > 100 ||
                mark3 < 0 || mark3 > 100 ||
                mark4 < 0 || mark4 > 100 ||
                mark5 < 0 || mark5 > 100
            ) {
                error.innerText = "Marks must be between 0 and 100.";
                result.style.display = "none";
                return;
            }

            // Calculate total
            let total = mark1 + mark2 + mark3 + mark4 + mark5;

            // Calculate percentage
            let percentage = total / 5;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            // Display result
            document.getElementById("studentName").innerText = name;
            document.getElementById("total").innerText = total;
            document.getElementById("percentage").innerText = percentage.toFixed(2);
            document.getElementById("grade").innerText = grade;

            result.style.display = "block";
        }
    </script>

</body>
</html>
